# Required checks on the default branch: unit, contract (and CodeQL, from default setup).
# Job names are the check names the Valxel SDLC and the branch ruleset look for; keep them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Reports go on the commit the pipeline checks: the PR head, or the pushed commit.
  REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report.py --context "unit / report" --junit reports/junit.xml --istanbul coverage/coverage-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:contract
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report.py --context "contract / report" --junit reports/junit.xml
      # The provider's CI verifies these. Publish them to a Pact Broker instead once you run one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacts
          path: pacts/
          retention-days: 30

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OpenChoreo builds and ships the image; this proves it builds, serves safely, and has no known
      # high or critical vulnerabilities with a fix available.
      - run: docker build --pull -t template-web:ci .
      # Syft and Grype run as containers (pinned versions), not as marketplace actions.
      - name: Software bill of materials
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.57.1 \
            docker:template-web:ci -o cyclonedx-json > sbom.cyclonedx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30
      - name: Scan for vulnerabilities with a fix
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.3 \
            docker:template-web:ci --only-fixed --fail-on high
      # Every page carries the security headers (nginx drops server-level headers in locations
      # that set their own, which is easy to break).
      - name: Check the security headers
        run: |
          docker run -d --name web -p 8080:8080 template-web:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz >/dev/null && break; sleep 1; done
          for path in / /some/page; do
            headers=$(curl -fsI "http://localhost:8080$path")
            for h in content-security-policy strict-transport-security x-content-type-options referrer-policy; do
              echo "$headers" | grep -qi "^$h:" || { echo "$path is missing $h"; exit 1; }
            done
          done
      # Bundles are served compressed, access logs are JSON without paths or query strings, and the
      # public telemetry endpoint answers 429 past its ceiling instead of passing a flood on.
      - name: Check compression, logs and limits
        run: |
          js=$(curl -fs http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsI -H 'Accept-Encoding: gzip' "http://localhost:8080$js" | grep -qi '^content-encoding: gzip'
          curl -fs "http://localhost:8080/patients/MRN-55821?name=Ana" >/dev/null
          docker logs web 2>/dev/null | grep '"route":"app"' | tail -1 | grep -q '"http.response.status_code":200'
          if docker logs web 2>&1 | grep -q 'MRN-55821\|name=Ana'; then echo "a path or query reached the log"; exit 1; fi
          docker run -d --name web-otel -p 8082:8080 -e OTEL_COLLECTOR_URL=http://127.0.0.1:9 template-web:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8082/healthz >/dev/null && break; sleep 1; done
          codes=$(for i in $(seq 1 400); do curl -s -o /dev/null -w '%{http_code}\n' -X POST http://localhost:8082/otlp/v1/traces; done | sort | uniq -c)
          echo "$codes"
          echo "$codes" | grep -q ' 429$' || { echo "no limit on /otlp/"; exit 1; }
      # Error reporting is off without a DSN, on with one, and a malformed DSN stops the container.
      - name: Check error reporting's configuration
        run: |
          test "$(curl -fs http://localhost:8080/sentry.json)" = '{"dsn":""}'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/sentry/envelope/)" = 404
          dsn=https://0123456789abcdef0123456789abcdef@sentry.io/42
          docker run -d --name web-sentry -p 8081:8080 -e SENTRY_DSN=$dsn -e SENTRY_ENVIRONMENT=ci template-web:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8081/healthz >/dev/null && break; sleep 1; done
          curl -fs http://localhost:8081/sentry.json | grep -q "\"dsn\":\"$dsn\",\"environment\":\"ci\""
          curl -fsI http://localhost:8081/sentry.json | grep -qi '^content-security-policy:'
          if docker run --rm -e SENTRY_DSN='https://evil.example/x' template-web:ci nginx -t 2>/dev/null; then
            echo "a malformed DSN was accepted"; exit 1
          fi
