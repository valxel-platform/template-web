# Performance smoke test, on pull requests the Vrixel SDLC labels vrixel:perf-smoke or
# vrixel:perf-full. Main's build and the PR's are measured the same way on this runner: Lighthouse
# (three runs each, median) for Largest Contentful Paint, Total Blocking Time and layout shift,
# and the compressed JavaScript the first page needs. perf/compare.py posts "perf-smoke / report":
# failed when the PR is more than 20% worse than main or misses the budget (LCP 2.5 s, TBT 200 ms,
# CLS 0.1, 200 KB of JavaScript).
name: perf

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: perf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perf-smoke:
    name: perf-smoke
    if: contains(github.event.pull_request.labels.*.name, 'vrixel:perf-smoke') || contains(github.event.pull_request.labels.*.name, 'vrixel:perf-full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: pr/.nvmrc
      - name: Build and measure main, then the PR
        run: |
          mkdir -p out
          for v in main pr; do
            (cd $v && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
            mkdir -p out/lhci-$v
            (cd out/lhci-$v && npx --yes @lhci/cli@0.16.0 collect --staticDistDir="$GITHUB_WORKSPACE/$v/dist" \
              --numberOfRuns=3 --settings.preset=desktop)
            node pr/perf/summarize.mjs out/lhci-$v/.lighthouseci out/$v.json $v/dist
          done
      - name: Judge and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 pr/perf/compare.py --kind web --run out/pr.json --reference out/main.json --regression 20 --context "perf-smoke / report"
