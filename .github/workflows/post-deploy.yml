# Runs after the Vrixel SDLC deploys a commit: integration in dev, end-to-end in staging, smoke in
# production. Results are posted on the deployed commit as "integration / report", "e2e / report"
# and "smoke / report", which the pipeline's quality gates read. In staging, when the change needs
# it (performance: full), Lighthouse too: "performance / report".
name: post-deploy

on:
  repository_dispatch:
    types: [vrixel-deployed]
  workflow_dispatch:
    inputs:
      stage:
        {
          description: "dev, staging or production",
          required: true,
          type: choice,
          options: [dev, staging, production],
        }
      base_url: { description: "URL of the deployed app", required: true }
      sha: { description: "Deployed commit", required: true }

permissions:
  contents: read

concurrency:
  group: post-deploy-${{ github.event.client_payload.stage || inputs.stage }}-${{ github.event.client_payload.sha || inputs.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify ${{ github.event.client_payload.stage || inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      STAGE: ${{ github.event.client_payload.stage || inputs.stage }}
      BASE_URL: ${{ github.event.client_payload.base_url || inputs.base_url }}
      REPORT_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REPORT_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the stage's suite
        id: run
        run: |
          case "$STAGE" in
            dev)        echo "suite=integration" >> "$GITHUB_OUTPUT"; npx playwright test ;;
            staging)    echo "suite=e2e" >> "$GITHUB_OUTPUT"; npx playwright test ;;
            production) echo "suite=smoke" >> "$GITHUB_OUTPUT"; npx playwright test --grep @smoke ;;
            *) echo "Unknown stage $STAGE" >&2; exit 2 ;;
          esac
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report.py --context "${{ steps.run.outputs.suite }} / report" --junit reports/e2e-junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Staging page performance, when the Vrixel SDLC says the change needs it: Lighthouse three times
  # against the deployed app (through the BFF), median LCP, TBT and CLS and the JavaScript actually
  # transferred, judged against the budget and the last passing run (the perf-baselines branch).
  performance:
    name: performance
    if: (github.event.client_payload.stage || inputs.stage) == 'staging' && github.event.client_payload.performance == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the perf-baselines branch
      statuses: write
    env:
      BASE_URL: ${{ github.event.client_payload.base_url }}
      REPORT_SHA: ${{ github.event.client_payload.sha }}
      SETTINGS: ${{ toJSON(github.event.client_payload.perf_settings) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REPORT_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Measure the deployed app
        run: |
          mkdir -p out/lhci
          (cd out/lhci && npx --yes @lhci/cli@0.16.0 collect --url="$BASE_URL" --numberOfRuns=3 --settings.preset=desktop)
          node perf/summarize.mjs out/lhci/.lighthouseci out/staging.json
      - name: Judge and report
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          budget=$(python3 -c 'import json,os; s=json.loads(os.environ["SETTINGS"] or "{}") or {}; print(json.dumps((s.get("budgets") or {}).get("web") or {}))')
          pct=$(python3 -c 'import json,os; s=json.loads(os.environ["SETTINGS"] or "{}") or {}; print(s.get("regression_pct") or 10)')
          python3 perf/compare.py --kind web --run out/staging.json --budget "$budget" --regression "$pct" \
            --baseline staging.json --save-baseline staging.json --context "performance / report"
