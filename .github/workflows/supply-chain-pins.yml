# Pins what the build pulls: every Dockerfile base image to its digest, and (Gradle repos) every
# dependency in gradle.lockfile with its checksum in gradle/verification-metadata.xml.
#   - on a branch named supply-chain-pins*: commits the pins to that branch
#   - on a Dependabot pull request: refreshes the lockfile and checksums for the new versions, so
#     the update passes verification
#   - weekly and on demand: opens a pull request if anything is unpinned
name: supply-chain-pins
on:
  push:
    branches: ["supply-chain-pins*"]
  pull_request:
  workflow_dispatch:
  schedule: [{ cron: "17 6 * * 1" }]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pins-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  pin:
    # Pull requests: only Dependabot's, from this repository.
    if: github.event_name != 'pull_request' || (github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Pin base images to their digests
        run: python3 .github/scripts/pin_images.py
      - name: Lock Gradle dependencies and their checksums
        if: hashFiles('gradlew') != ''
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          if ! grep -q '^distributionSha256Sum=' "$props"; then
            url=$(sed -n 's/^distributionUrl=//p' "$props" | sed 's#\\:#:#g')
            echo "distributionSha256Sum=$(curl -fsSL "$url.sha256")" >> "$props"
          fi
          ./gradlew --no-daemon -q --write-locks --write-verification-metadata sha256 dependencies build -x test
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          git add -A
          git diff --cached --quiet && { echo "nothing to pin"; exit 0; }
          git -c user.name="vrixel-pins" -c user.email="vrixel-pins@users.noreply.github.com" \
            commit -q -m "Pin base images, dependencies and their checksums"
          if [ "$REF" = "main" ]; then
            branch="supply-chain-pins-$(date +%Y%m%d)"
            git push -q origin "HEAD:refs/heads/$branch"
            gh pr create --head "$branch" --title "Pin base images and dependencies" \
              --body "Base images pinned to their digests, and (Gradle) dependencies locked with checksums, by supply-chain-pins."
          else
            git push -q origin "HEAD:$REF"
          fi
