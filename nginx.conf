server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers (security-headers.conf). nginx drops a server's add_header lines in any
    # location that has its own, so every such location includes them again.
    include /etc/nginx/snippets/security-headers.conf;

    # Feature flags (OFREP), forwarded to the product's Flipt; written at start by docker/30-flags.sh.
    include /etc/nginx/conf.d/flags.locations;
    # Browser traces (OTLP), forwarded to the data plane's collector; written by docker/31-otel.sh.
    include /etc/nginx/conf.d/otel.locations;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
