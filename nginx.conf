# This file is included in nginx's http block (conf.d/default.conf).

# Endpoints anyone on the internet can post to (browser traces, error reports, flag lookups) get a
# ceiling per container: a flood is refused (429) here instead of reaching the collector, Sentry or
# Flipt. Every request comes through the product's gateway and BFF, so the limit is per container,
# not per visitor (the caller's address isn't trustworthy this far in).
limit_req_zone $server_name zone=telemetry:1m rate=50r/s;
limit_req_zone $server_name zone=errors:1m rate=20r/s;
limit_req_zone $server_name zone=flags:1m rate=200r/s;
limit_req_status 429;

# Access logs as JSON lines, like every other component, with the route's kind instead of its
# path: an app path can hold an id, and the query string never reaches the log.
map $uri $route {
    ~^/assets/      assets;
    ~^/otlp/        otlp;
    ~^/sentry       sentry;
    ~^/ofrep/       ofrep;
    /healthz        healthz;
    default         app;
}
log_format json escape=json '{"@timestamp":"$time_iso8601","http.request.method":"$request_method",'
    '"route":"$route","http.response.status_code":$status,"http.response.body.bytes":$body_bytes_sent,'
    '"event.duration_s":$request_time,"trace.parent":"$http_traceparent"}';

# Pre-compressed bundles (.gz, made at build) are sent as they are; anything else is compressed
# on the fly.
gzip on;
gzip_static on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

server {
    listen 8080;
    access_log /var/log/nginx/access.log json;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Security headers (security-headers.conf). nginx drops a server's add_header lines in any
    # location that has its own, so every such location includes them again.
    include /etc/nginx/snippets/security-headers.conf;

    # Feature flags (OFREP), forwarded to the product's Flipt; written at start by docker/30-flags.sh.
    include /etc/nginx/conf.d/flags.locations;
    # Browser traces (OTLP), forwarded to the data plane's collector; written by docker/31-otel.sh.
    include /etc/nginx/conf.d/otel.locations;
    # Error reports to Sentry, and /sentry.json for the app; written by docker/32-sentry.sh.
    include /etc/nginx/conf.d/sentry.locations;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
